
trigger:
  batch: true
  branches:
    include:
    - master
pr: none
variables:
  azureSubscription: azure-challengeapi
  buildConfiguration: Release
  artifactName: app
  System.PreferGitFromPath: true
stages:
- stage: Infraestrutura
  displayName: Criar infraestrutura
  jobs:
  - job: CriarInfra
    pool:
      name: Default
      demands:
      - Agent.Name -equals PIPOCO
      - Agent.OS -equals Windows_NT
    steps:
    - checkout: self
      clean: true
    - task: AzureCLI@2
      displayName: Criar grupo de recursos
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: ps
        scriptLocation: scriptPath
        scriptPath: scripts/01-criar-grupo.ps1
        visibleAzLogin: false
    - task: AzureCLI@2
      displayName: Criar plano Linux
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: ps
        scriptLocation: scriptPath
        scriptPath: scripts/02-criar-plano.ps1
        visibleAzLogin: false
    - task: AzureCLI@2
      displayName: Criar Web App .NET 8
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: ps
        scriptLocation: scriptPath
        scriptPath: scripts/03-criar-webapp.ps1
        visibleAzLogin: false
      name: webapp
- stage: BuildTestes
  displayName: Build, testes e artefato
  dependsOn: Infraestrutura
  condition: succeeded()
  jobs:
  - job: BuildTest
    pool:
      name: Default
      demands:
      - Agent.Name -equals PIPOCO
      - Agent.OS -equals Windows_NT
    steps:
    - checkout: self
      clean: true
    - powershell: |
        $publishDir = "$(Build.ArtifactStagingDirectory)/publish"
        if (Test-Path -LiteralPath $publishDir) {
          Remove-Item -LiteralPath $publishDir -Recurse -Force
        }
      displayName: Limpar publicacao anterior
    - task: UseDotNet@2
      displayName: SDK .NET 8
      inputs:
        packageType: sdk
        version: 8.0.x
    - task: DotNetCoreCLI@2
      displayName: Restaurar dependencias
      inputs:
        command: restore
        projects: ChallengeAPI.sln
    - task: DotNetCoreCLI@2
      displayName: Compilar solucao
      inputs:
        command: build
        projects: ChallengeAPI.sln
        arguments: --configuration $(buildConfiguration) --no-restore
    - task: DotNetCoreCLI@2
      displayName: Executar testes unitarios e de integracao
      inputs:
        command: test
        projects: ChallengeAPI.sln
        arguments: --configuration $(buildConfiguration) --no-build --no-restore
        publishTestResults: true
        testRunTitle: Testes ChallengeAPI
    - task: DotNetCoreCLI@2
      displayName: Publicar API
      inputs:
        command: publish
        publishWebProjects: false
        projects: ChallengeAPI.csproj
        arguments: --configuration $(buildConfiguration) --no-build --no-restore --output $(Build.ArtifactStagingDirectory)/publish
        zipAfterPublish: false
        modifyOutputPath: false
    - task: ArchiveFiles@2
      displayName: Compactar aplicacao
      inputs:
        rootFolderOrFile: $(Build.ArtifactStagingDirectory)/publish
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(artifactName).zip
        replaceExistingArchive: true
    - task: PublishPipelineArtifact@1
      displayName: Publicar artefato
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/$(artifactName).zip
        artifact: $(artifactName)
        publishLocation: pipeline
- stage: Deploy
  displayName: Deploy no Azure App Service
  dependsOn:
  - Infraestrutura
  - BuildTestes
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  variables:
    webAppName: $[ stageDependencies.Infraestrutura.CriarInfra.outputs['webapp.webAppName'] ]
  jobs:
  - job: DeployWebApp
    pool:
      name: Default
      demands:
      - Agent.Name -equals PIPOCO
      - Agent.OS -equals Windows_NT
    steps:
    - checkout: self
      clean: true
    - task: DownloadPipelineArtifact@2
      displayName: Baixar artefato
      inputs:
        buildType: current
        artifactName: $(artifactName)
        targetPath: $(Pipeline.Workspace)/$(artifactName)
    - task: AzureCLI@2
      displayName: Configurar variaveis protegidas da API
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: ps
        scriptLocation: scriptPath
        scriptPath: scripts/04-configurar-api.ps1
        visibleAzLogin: false
      env:
        ORACLE_CONNECTION: $(OracleConnection)
        JWT_SECRET_KEY: $(JwtSecretKey)
        JWT_ISSUER: $(JwtIssuer)
        JWT_AUDIENCE: $(JwtAudience)
        MONGO_CONNECTION: $(MongoConnection)
        MONGO_DATABASE: $(MongoDatabase)
    - task: AzureWebApp@1
      displayName: Deploy da API
      inputs:
        azureSubscription: $(azureSubscription)
        appType: webAppLinux
        appName: $(webAppName)
        package: $(Pipeline.Workspace)/$(artifactName)/$(artifactName).zip
        runtimeStack: DOTNETCORE|8.0
        startUpCommand: dotnet ChallengeAPI.dll
        deploymentMethod: zipDeploy
    - task: AzureCLI@2
      displayName: Conferir API e Oracle
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: ps
        scriptLocation: scriptPath
        scriptPath: scripts/05-verificar-api.ps1
        visibleAzLogin: false
