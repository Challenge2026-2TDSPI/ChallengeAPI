<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura Azure da CLYVO VET</title>
  <desc id="desc">Cliente acessa a API ASP.NET Core no Azure App Service por HTTPS. O App Service se conecta ao Azure SQL Database por TDS criptografado. O codigo e publicado via Azure CLI com ZIP deploy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eaf4ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1687d9"/>
      <stop offset="1" stop-color="#0067b8"/>
    </linearGradient>
    <linearGradient id="sql" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7556c8"/>
      <stop offset="1" stop-color="#4f3aa5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b3658" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0067b8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b45ad"/>
    </marker>
    <style>
      .title { font: 700 38px 'Segoe UI', Arial, sans-serif; fill: #12344d; }
      .subtitle { font: 400 20px 'Segoe UI', Arial, sans-serif; fill: #45677e; }
      .zone { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0067b8; letter-spacing: 1.5px; }
      .card-title { font: 700 23px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .card-subtitle { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #ffffff; opacity: .9; }
      .body { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #254a63; }
      .small { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #527086; }
      .label { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #285c7e; }
      .white-label { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text class="title" x="80" y="72">CLYVO VET - Arquitetura App Service</text>
  <text class="subtitle" x="80" y="108">Aplicacao e banco como servicos PaaS, provisionados integralmente por Azure CLI</text>

  <!-- Origem externa -->
  <rect x="70" y="260" width="300" height="230" rx="24" fill="#ffffff" stroke="#b7d3e7" stroke-width="2"/>
  <circle cx="220" cy="325" r="42" fill="#e6f3fc"/>
  <circle cx="220" cy="313" r="14" fill="#1687d9"/>
  <path d="M185 355c8-25 62-25 70 0" fill="#1687d9"/>
  <text class="body" x="220" y="403" text-anchor="middle" style="font-weight:700;font-size:24px">Cliente</text>
  <text class="small" x="220" y="435" text-anchor="middle">Swagger / Postman / Aplicacao</text>
  <text class="small" x="220" y="462" text-anchor="middle">Requisicoes e respostas JSON</text>

  <!-- Limite Azure -->
  <rect x="470" y="165" width="1060" height="625" rx="34" fill="#ffffff" fill-opacity="0.62" stroke="#1687d9" stroke-width="3" stroke-dasharray="12 10"/>
  <rect x="505" y="140" width="360" height="52" rx="16" fill="#ffffff" stroke="#1687d9" stroke-width="2"/>
  <text class="zone" x="532" y="173">AZURE RESOURCE GROUP</text>

  <!-- App Service Plan -->
  <rect x="555" y="250" width="430" height="360" rx="28" fill="#eef8ff" stroke="#8fc8ef" stroke-width="2"/>
  <text class="label" x="585" y="288">APP SERVICE PLAN - LINUX</text>

  <!-- App Service -->
  <rect x="605" y="325" width="330" height="225" rx="24" fill="#0078d4"/>
  <circle cx="770" cy="375" r="39" fill="#ffffff" fill-opacity=".95"/>
  <text x="770" y="383" text-anchor="middle" style="font:700 22px 'Segoe UI',Arial,sans-serif;fill:#0078d4">API</text>
  <text class="card-title" x="770" y="440" text-anchor="middle">Azure App Service</text>
  <text class="card-subtitle" x="770" y="472" text-anchor="middle">ChallengeAPI - .NET 8</text>
  <rect x="674" y="493" width="192" height="37" rx="18" fill="#ffffff" fill-opacity=".18"/>
  <text class="white-label" x="770" y="518" text-anchor="middle">REST + Swagger + Health</text>

  <!-- SQL logical server / database -->
  <rect x="1080" y="250" width="360" height="360" rx="28" fill="#f5f1ff" stroke="#bcb0eb" stroke-width="2"/>
  <text class="label" x="1110" y="288" fill="#5b45ad">AZURE SQL LOGICAL SERVER</text>
  <rect x="1130" y="325" width="260" height="225" rx="24" fill="#5b45ad"/>
  <ellipse cx="1260" cy="370" rx="40" ry="16" fill="#ffffff"/>
  <path d="M1220 370v54c0 9 18 16 40 16s40-7 40-16v-54" fill="#ffffff" opacity=".9"/>
  <ellipse cx="1260" cy="424" rx="40" ry="16" fill="#e9e3ff"/>
  <text class="card-title" x="1260" y="468" text-anchor="middle">Azure SQL Database</text>
  <text class="card-subtitle" x="1260" y="497" text-anchor="middle">ClyvoVetDb - PaaS</text>
  <rect x="1167" y="507" width="186" height="31" rx="15" fill="#ffffff" fill-opacity=".18"/>
  <text class="white-label" x="1260" y="529" text-anchor="middle">4 tabelas relacionadas</text>

  <!-- Trafego -->
  <path d="M370 375 H592" fill="none" stroke="#0067b8" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text class="label" x="481" y="350" text-anchor="middle">HTTPS :443</text>
  <text class="small" x="481" y="404" text-anchor="middle">API REST</text>

  <path d="M938 430 H1117" fill="none" stroke="#5b45ad" stroke-width="5" marker-start="url(#arrowPurple)" marker-end="url(#arrowPurple)"/>
  <text class="label" x="1027" y="400" text-anchor="middle" fill="#5b45ad">SQL :1433</text>
  <text class="small" x="1027" y="468" text-anchor="middle" style="font-size:14px">TLS</text>

  <!-- Provisionamento / deploy -->
  <rect x="610" y="680" width="780" height="72" rx="20" fill="#12344d"/>
  <text class="card-subtitle" x="650" y="710">GitHub clone + scripts Azure CLI</text>
  <text class="card-subtitle" x="650" y="738">Criacao dos recursos, configuracao, DDL e ZIP deploy da aplicacao</text>
  <path d="M805 680 V625" fill="none" stroke="#12344d" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M1260 680 V625" fill="none" stroke="#12344d" stroke-width="4" marker-end="url(#arrowPurple)"/>

  <!-- Legend -->
  <rect x="70" y="700" width="455" height="92" rx="18" fill="#ffffff" stroke="#c8dce9"/>
  <circle cx="106" cy="735" r="9" fill="#1687d9"/>
  <text class="small" x="126" y="741">Aplicacao PaaS com runtime gerenciado</text>
  <circle cx="106" cy="769" r="9" fill="#5b45ad"/>
  <text class="small" x="126" y="775">Banco de dados PaaS com persistencia</text>

  <text class="small" x="800" y="850" text-anchor="middle">Sem infraestrutura local - Recursos reproduziveis por scripts - Credenciais fora do codigo-fonte</text>
</svg>
